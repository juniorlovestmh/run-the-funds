<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rtf · Teller Connect</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px; color: #333; }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p { font-size: 14px; color: #666; }
</style>
</head>
<body>
<h1>rtf · Teller Connect</h1>
<p id="status">Opening Teller Connect…</p>
<script src="https://cdn.teller.io/connect/connect.js"></script>
<script>
  function setStatus(text) {
    document.getElementById("status").textContent = text;
  }
  const tellerConnect = TellerConnect.setup({
    applicationId: "{{APP_ID}}",
    environment: "{{ENVIRONMENT}}",
    products: ["transactions", "balance"],
    onSuccess: function(enrollment) {
      setStatus("Linked. Saving to rtf…");
      fetch("/success", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(enrollment)
      }).then(function() {
        setStatus("Linked. You can close this tab.");
      }).catch(function(err) {
        setStatus("Widget succeeded but the local callback failed: " + err);
      });
    },
    onFailure: function(failure) {
      fetch("/failure", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(failure)
      });
      setStatus("Connect failed. Close this tab and check the rtf CLI for details.");
    },
    onExit: function() {
      fetch("/exit", { method: "POST", body: "{}" });
      setStatus("Cancelled. You can close this tab.");
    },
  });
  tellerConnect.open();
</script>
</body>
</html>
