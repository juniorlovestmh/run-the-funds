<svg width="420" height="120" viewBox="0 0 420 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0B0F14; }
    .accent { fill: #3FB950; }
    .text { fill: #E6EDF3; font-family: monospace; font-weight: 600; }
    .sub { fill: #8B949E; font-family: monospace; font-size: 14px; }
  </style>

  <!-- background -->
  <rect width="420" height="120" rx="12" class="bg"></rect>

  <!-- prompt icon -->
  <text x="20" y="50" class="accent" font-size="28">&gt;</text>
  <text x="40" y="50" class="accent" font-size="28">_</text>

  <!-- main text -->
  <text x="80" y="50" class="text" font-size="28">rtf</text>

  <!-- subtitle -->
  <text x="80" y="80" class="sub">run the funds</text>
</svg>